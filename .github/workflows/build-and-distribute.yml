name: Build and distribute

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-and-distribute-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: 10.0.301
  PROJECT_PATH: src/PulseRelay.Desktop/PulseRelay.Desktop.csproj
  PRODUCT_NAME: PulseRelay
  PRODUCT_VERSION: 0.1.${{ github.run_number }}

jobs:
  validate:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore PulseRelay.sln

      - name: Build
        run: dotnet build PulseRelay.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test PulseRelay.sln --configuration Release --no-build

      - name: Collect code coverage
        run: >
          dotnet test PulseRelay.CrossPlatform.slnf
          --configuration Release
          --no-build
          --settings coverlet.runsettings
          --collect:"XPlat Code Coverage"
          --results-directory artifacts/coverage

      - name: Enforce 95% line coverage
        run: ruby scripts/check-coverage.rb 95

      - name: Publish Linux probe smoke binary
        run: >
          dotnet publish src/PulseRelay.Probe/PulseRelay.Probe.csproj
          --configuration Release
          --framework net10.0
          --runtime linux-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false
          --output artifacts/smoke/probe-linux-x64

      - name: Smoke test Linux probe
        run: artifacts/smoke/probe-linux-x64/PulseRelay.Probe mock --interval-ms 1 --sample-count 1

  package:
    name: Package ${{ matrix.rid }}
    runs-on: ubuntu-latest
    needs: validate

    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            target-framework: net10.0-windows10.0.19041.0
            run-command: PulseRelay.Desktop.exe
          - rid: linux-x64
            target-framework: net10.0
            run-command: ./PulseRelay.Desktop
          - rid: linux-arm64
            target-framework: net10.0
            run-command: ./PulseRelay.Desktop

    env:
      RID: ${{ matrix.rid }}
      TARGET_FRAMEWORK: ${{ matrix.target-framework }}
      RUN_COMMAND: ${{ matrix.run-command }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish app
        run: >
          dotnet publish "${{ env.PROJECT_PATH }}"
          --configuration Release
          --framework "${{ env.TARGET_FRAMEWORK }}"
          --runtime "${{ env.RID }}"
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -p:Version="${{ env.PRODUCT_VERSION }}"
          -p:InformationalVersion="${{ env.PRODUCT_VERSION }}+${{ github.sha }}"
          --output "artifacts/publish/${{ env.PRODUCT_NAME }}-${{ env.PRODUCT_VERSION }}-${{ env.RID }}"

      - name: Add distribution documents
        shell: bash
        run: |
          set -euo pipefail
          package_dir="artifacts/publish/${PRODUCT_NAME}-${PRODUCT_VERSION}-${RID}"

          cp LICENSE README.md README.ja.md "$package_dir/"
          rm -rf "$package_dir/docs"
          cp -R docs "$package_dir/docs"

          cat > "$package_dir/RELEASE.txt" <<EOF
          ${PRODUCT_NAME} ${PRODUCT_VERSION} (${RID})

          Commit: ${GITHUB_SHA}
          Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          Start: ${RUN_COMMAND}
          EOF

      - name: Create zip package
        shell: bash
        run: |
          set -euo pipefail
          package_dir="artifacts/publish/${PRODUCT_NAME}-${PRODUCT_VERSION}-${RID}"
          zip_name="${PRODUCT_NAME}-${PRODUCT_VERSION}-${RID}.zip"
          zip_path="${GITHUB_WORKSPACE}/artifacts/packages/${zip_name}"
          checksum_path="${zip_path}.sha256"

          mkdir -p "${GITHUB_WORKSPACE}/artifacts/packages"
          rm -f "$zip_path" "$checksum_path"
          (cd "$package_dir" && zip -r "$zip_path" .)
          (cd "$(dirname "$zip_path")" && sha256sum "$zip_name" > "${zip_name}.sha256")

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PRODUCT_NAME }}-${{ env.PRODUCT_VERSION }}-${{ env.RID }}
          path: |
            artifacts/packages/${{ env.PRODUCT_NAME }}-${{ env.PRODUCT_VERSION }}-${{ env.RID }}.zip
            artifacts/packages/${{ env.PRODUCT_NAME }}-${{ env.PRODUCT_VERSION }}-${{ env.RID }}.zip.sha256
          if-no-files-found: error

  release:
    name: Publish numbered release
    runs-on: ubuntu-latest
    needs: package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/release
          pattern: ${{ env.PRODUCT_NAME }}-${{ env.PRODUCT_VERSION }}-*
          merge-multiple: true

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v${PRODUCT_VERSION}"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          commit_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
          notes_path="${RUNNER_TEMP}/release-notes.md"

          cat > "$notes_path" <<EOF
          Automated PulseRelay build ${PRODUCT_VERSION}.

          Commit: ${commit_url}
          Workflow run: ${run_url}

          Assets:
          - ${PRODUCT_NAME}-${PRODUCT_VERSION}-win-x64.zip
          - ${PRODUCT_NAME}-${PRODUCT_VERSION}-linux-x64.zip
          - ${PRODUCT_NAME}-${PRODUCT_VERSION}-linux-arm64.zip
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --force "$tag" "${GITHUB_SHA}"
          git push --force origin "refs/tags/$tag"

          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" artifacts/release/*.zip artifacts/release/*.sha256 --clobber
            gh release edit "$tag" \
              --title "${PRODUCT_NAME} ${PRODUCT_VERSION}" \
              --notes-file "$notes_path" \
              --prerelease \
              --latest=false
          else
            gh release create "$tag" artifacts/release/*.zip artifacts/release/*.sha256 \
              --title "${PRODUCT_NAME} ${PRODUCT_VERSION}" \
              --notes-file "$notes_path" \
              --prerelease \
              --latest=false \
              --target "${GITHUB_SHA}"
          fi
